name: Bug report
description: Something isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, what you expected, and how to reproduce.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Klag version
      description: Image tag, Helm appVersion, or `GET /version`.
      placeholder: e.g. 0.2.10
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How you run Klag (Docker / Helm / JAR), metrics reporter, Kafka version if relevant.
      placeholder: Docker JVM, prometheus, Kafka 3.8 / Strimzi
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs or `/metrics` snippets. Redact secrets.
      render: shell
    validations:
      required: false
